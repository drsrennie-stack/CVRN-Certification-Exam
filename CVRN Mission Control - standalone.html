document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:var(--acc);margin-bottom:12px\">{{ xEyebrow }}<\u002Fdiv>\n            <p style=\"font-size:17px;font-weight:600;line-height:1.5;margin:0 0 16px\">{{ xStem }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ xOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"cursor:pointer;text-align:left;font-family:'Plus Jakarta Sans',sans-serif;font-size:14.5px;line-height:1.5;padding:12px 15px;border-radius:10px;border:1px solid {{ o.bc }};background:{{ o.bg }};color:var(--ink)\" style-hover=\"border-color:var(--acc)\">{{ o.t }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;margin-top:16px\">\n              <button sc-camel-on-click=\"{{ xSubmit }}\" style=\"cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.02em;padding:12px 22px;border-radius:99px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);box-shadow:var(--glow)\">{{ xNextLabel }}<\u002Fbutton>\n              <span style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12px;color:var(--amber)\">{{ notice }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:{{ vExamReport }}\">\n          <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:44px;font-weight:700;color:var(--acc)\">{{ xPct }}<\u002Fdiv>\n            <p style=\"font-size:14.5px;color:var(--soft);max-width:78ch;margin:6px 0 18px\">{{ xLede }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:22px\">\n              <sc-for list=\"{{ xRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line2);padding-bottom:8px\">\n                  <span style=\"font-size:14px;font-weight:600\">{{ r.dom }}<\u002Fspan>\n                  <span style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12px;color:var(--mute)\">{{ r.meta }}<\u002Fspan>\n                  <span style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:10px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;border:1px solid {{ r.pc }};color:{{ r.pc }}\">{{ r.pill }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--red);margin-bottom:10px\">&gt; REVIEW THE MISSES<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ misses }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid var(--red);border-radius:10px;padding:14px 16px\">\n                  <div style=\"font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.1em;color:var(--red);margin-bottom:6px\">{{ m.dom }}<\u002Fdiv>\n                  <p style=\"margin:0 0 8px;font-size:14px;font-weight:600\">{{ m.q }}<\u002Fp>\n                  <p style=\"margin:0 0 8px;font-size:13px;color:var(--mute);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700\">you: {{ m.chose }}<br>correct: {{ m.correct }}<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;color:var(--soft)\">{{ m.why }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ backToForms }}\" style=\"cursor:pointer;margin-top:18px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12px;font-weight:800;letter-spacing:.08em;padding:12px 22px;border-radius:99px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);box-shadow:var(--glow)\">BACK TO FORMS<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:{{ vEcg }};padding-top:10px\">\n      <x-import component-from-global-scope=\"cvrn-ecg-lab\" from=\"a7678aa7-098c-485a-82ac-8fcdb5cedf16#/ecg-lab.js\" hint-size=\"100%,900px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"display:{{ vNotes }};padding-top:10px\">\n      <x-import component-from-global-scope=\"cvrn-notes\" from=\"58dffeae-9653-44f4-8476-fbc3b81706a1#/notes-content.js\" hint-size=\"100%,900px\"><\u002Fx-import>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:60px;border-top:1px solid var(--line);padding-top:18px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:11px;color:var(--mute);letter-spacing:.06em\">CVRN/OS · ECG &amp; CVRN-BC REVIEW · MEDMASTERS COLLABORATIVE · PROGRESS STORED IN THIS BROWSER<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;boot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;queueSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:3,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = {ready:false,dark:true,route:'today',interview:false,step:0,notice:'',gapMode:'idle',diag:null,dPick:null,dSure:null,dFb:null,ex:null,xPick:null,showWeeks:false};\n  save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}\n  componentDidMount(){\n    const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};\n    this.S=load('cvrn-setup',{level:2,date:'',days:4,mins:45,exp:0.35,goal:0.85,formMode:'quick'});\n    this.P=load('cvrn-progress',{}); this.X=load('cvrn-exams',{});\n    this.draft={...this.S};\n    let dark=true; try{if(localStorage.getItem('cvrn-theme')==='off')dark=false}catch(e){}\n    document.documentElement.setAttribute('data-dark',dark?'on':'off');\n    const routes=['today','gaps','ecg','notes','exams'];\n    this._onHash=()=>{const h=(location.hash||'').replace(/^#\\/?/,''); if(routes.includes(h)&&h!==this.state.route)this.setState({route:h});};\n    window.addEventListener('hashchange',this._onHash);\n    const h0=(location.hash||'').replace(/^#\\/?/,'');\n    this.setState({dark,route:routes.includes(h0)?h0:'today',interview:!this.S.date});\n    const poll=()=>{const ok=window.CVRN_COMPETENCIES&&window.CVRN_COMPETENCIES.length;\n      if(ok){this.C=window.CVRN_COMPETENCIES;this.POOL=window.CVRN_EXAM_POOL||[];this.buildDoms();this.setState({ready:true});}\n      else setTimeout(poll,120);};\n    poll();\n  }\n  componentWillUnmount(){window.removeEventListener('hashchange',this._onHash);}\n  buildDoms(){const D={};this.C.forEach(c=>{if(!D[c.domain])D[c.domain]={id:c.domain,name:c.domainName,weight:c.domainWeight,weightL1:c.weightL1,weightL2:c.weightL2,level:c.level,comps:[]};D[c.domain].comps.push(c);});\n    this.DOMS=D;this.DOMLIST=Object.keys(D).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).map(k=>D[k]);}\n  go(r){this.setState({route:r,notice:''});try{history.replaceState(null,'','#/'+r)}catch(e){}}\n  toggleTheme(){const dark=!this.state.dark;document.documentElement.setAttribute('data-dark',dark?'on':'off');try{localStorage.setItem('cvrn-theme',dark?'on':'off')}catch(e){}this.setState({dark});}\n  LV(){return parseInt(this.S.level,10)}\n  wt(c){const w=this.LV()===1?c.weightL1:c.weightL2;return w==null?(c.domainWeight||5):w}\n  domWt(d){const w=this.LV()===1?d.weightL1:d.weightL2;return w==null?d.weight:w}\n  inScope(){return (this.C||[]).filter(c=>c.level<=this.LV())}\n  daysToExam(){if(!this.S.date)return null;const d=new Date(this.S.date+'T12:00:00');return Math.max(0,Math.round((d-new Date())/864e5))}\n  plan(){const scope=this.inScope(),dte=this.daysToExam();const studyDays=dte==null?null:Math.floor(dte/7*this.S.days);const availMin=studyDays==null?null:studyDays*this.S.mins;const raw=scope.reduce((a,c)=>a+c.est,0);const needMin=Math.round(raw*(1-this.S.exp*0.55)*(0.72+this.S.goal*0.55));return{scope,dte,studyDays,availMin,needMin}}\n  verdict(){const p=this.plan();if(p.availMin==null)return{k:'var(--amber)',t:'SET A DATE',b:'Enter your approximate exam date and the pace calculation turns on. Everything else works without it, but the schedule is the part that keeps people honest.'};\n    const ratio=p.availMin/p.needMin,hA=Math.round(p.availMin/60),hN=Math.round(p.needMin/60);\n    if(ratio>=1.15)return{k:'var(--green)',t:'THE PLAN FITS',b:'About '+hA+' hours available against roughly '+hN+' hours of content. That leaves margin for the weak areas the gap finder turns up. Hold the schedule and you will finish with review time left.',s:'PACE ON TRACK'};\n    if(ratio>=0.85)return{k:'var(--amber)',t:'TIGHT BUT WORKABLE',b:'About '+hA+' hours available against '+hN+' needed. There is no slack for a bad week. Add one study day per week, or accept that low-weight competencies get a lighter pass — the system prioritizes by blueprint weight either way.',s:'PACE TIGHT'};\n    const addDays=Math.ceil((p.needMin-p.availMin)/this.S.mins),addWk=Math.ceil(addDays/(p.dte/7||1));\n    return{k:'var(--red)',t:'SHORT BY A MEANINGFUL MARGIN',b:'About '+hA+' hours against '+hN+' needed. That gap will not close by studying harder on the days you already have. Add about '+addWk+' more study day'+(addWk===1?'':'s')+' per week, move the exam date out, or sit Level I first.',s:'PACE SHORT'}}\n  weeks(){const p=this.plan();if(!p.dte)return[];const weeks=Math.max(1,Math.ceil(p.dte/7));\n    const ordered=p.scope.slice().sort((a,b)=>this.wt(b)-this.wt(a)||a.domain.localeCompare(b.domain));\n    const per=Math.ceil(ordered.length/Math.max(1,weeks-1));const out=[];let i=0;\n    for(let w=1;w<=weeks;w++){\n      if(w===weeks){out.push({n:w,focus:'Consolidation',comps:'No new content',recall:'All flagged items plus full review',mile:'Practice exams 9 and 10, then rest'});}\n      else{const chunk=ordered.slice(i,i+per);i+=per;const doms={};chunk.forEach(c=>{doms[c.domainName]=1});\n        const ks=Object.keys(doms);const focus=ks.slice(0,2).join(', ')+(ks.length>2?', and more':'');\n        out.push({n:w,focus:focus||'Review',comps:String(chunk.length),recall:'Due items from weeks 1 to '+Math.max(1,w-1),mile:w%2===0?('Practice exam '+Math.min(10,Math.floor(w/2))):'Weakness queue sweep'});}}\n    return out}\n  ent(id){return this.P[id]||{attempts:0,correct:0,misconceptions:0,selfRate:null,strength:null}}\n  put(id,e){this.P[id]=e;this.save('cvrn-progress',this.P)}\n  stateOf(c){const e=this.P[c.id];if(!e||(!e.attempts&&e.selfRate==null))return{k:'untested',label:'UNTESTED',score:0};\n    if(!e.attempts){const r=e.selfRate;return{k:r<=1?'gap':'fragile',label:r<=1?'SELF-RATED GAP':'SELF-RATED FRAGILE',score:(r||0)/3*0.5}}\n    const s=e.strength!=null?e.strength:e.correct/e.attempts;\n    if(e.misconceptions>0&&s<0.85)return{k:'misc',label:'MISCONCEPTION',score:s};\n    if(s>=0.85)return{k:'mastered',label:'MASTERED',score:s};\n    if(s>=0.5)return{k:'fragile',label:'FRAGILE',score:s};\n    return{k:'gap',label:'GAP',score:s}}\n  decay(c){const e=this.P[c.id];if(!e||!e.reviewedAt)return 1;const d=(Date.now()-new Date(e.reviewedAt+'T12:00:00'))/864e5;return Math.min(1.6,1+d/21)}\n  priority(c){const SEV={misc:1,gap:.8,fragile:.4,untested:.65,mastered:.05};return(this.wt(c)/14)*SEV[this.stateOf(c).k]*this.decay(c)*(c.dok>=3?1.15:1)}\n  ranked(){return this.inScope().map(c=>({c,p:this.priority(c),st:this.stateOf(c)})).sort((a,b)=>b.p-a.p)}\n  pillC(k){return{mastered:'var(--green)',fragile:'var(--amber)',gap:'var(--red)',misc:'var(--red)',untested:'var(--mute)'}[k]||'var(--mute)'}\n  steps(){const mk=(t,sub,opts,key)=>({t,sub,opts,key});return[\n    mk('Which exam are you sitting?','Level decides scope. Level I covers domains 1\\u20137; Level II covers all 14.',[{t:'Level I \\u2014 Non-Acute Care',sub:'150 items',v:1},{t:'Level II \\u2014 Acute Care',sub:'200 items',v:2}],'level'),\n    {t:'When is your exam?',sub:'Approximate is fine \\u2014 the pace recalculates any time you change it.',date:true},\n    mk('How many days a week can you actually study?','Be honest. The verdict is only useful if this is real.',[2,3,4,5,6,7].map(n=>({t:n+' days',sub:'',v:n})),'days'),\n    mk('How many minutes per study day?','',[20,30,45,60,90,120].map(n=>({t:n+' minutes',sub:'',v:n})),'mins'),\n    mk('Where are you starting from?','This discounts content you already hold.',[{t:'New to cardiac',sub:'or returning after time away',v:0.15},{t:'Working cardiac or step-down',sub:'comfortable with the basics',v:0.35},{t:'Experienced ICU or cath lab',sub:'reviewing for the credential',v:0.55}],'exp'),\n    mk('What score are you aiming for?','Higher targets add review passes to the estimate.',[{t:'Pass comfortably',sub:'around 75 percent',v:0.75},{t:'Strong pass',sub:'around 85 percent',v:0.85},{t:'Top band',sub:'above 90 percent',v:0.92}],'goal')]}\n  pickOpt(key,v){this.draft[key]=v;this.advance()}\n  advance(){if(this.state.step>=5){this.S={...this.S,...this.draft};this.save('cvrn-setup',this.S);this.setState({interview:false,step:0,notice:''});}else this.setState({step:this.state.step+1,notice:''});}\n  fullLen(){return this.LV()===1?150:200}\n  formSize(){return this.S.formMode==='full'?this.fullLen():30}\n  buildForms(){const FS=this.formSize();const scopeDoms=this.DOMLIST.filter(d=>d.level<=this.S.level);\n    const wtot=scopeDoms.reduce((a,d)=>a+this.domWt(d),0);const buckets={};\n    scopeDoms.forEach(d=>{buckets[d.id]=this.POOL.filter(q=>q.d===d.id).slice()});\n    const forms=[];for(let f=0;f<10;f++)forms.push({n:f+1,items:[],missing:0});\n    scopeDoms.forEach(d=>{const slots=Math.max(1,Math.round(FS*this.domWt(d)/wtot));const b=buckets[d.id];let idx=0;\n      for(let f=0;f<10;f++){let got=0;while(got<slots&&idx<b.length){forms[f].items.push(b[idx++]);got++}forms[f].missing+=slots-got}});\n    return forms}\n  startExam(fm){this.setState({ex:{fm,i:0,ans:[],byDom:{}},xPick:null,notice:''})}\n  xSubmit(){const ex=this.state.ex;if(!ex)return;\n    if(ex.i>=ex.fm.items.length)return;\n    if(this.state.xPick==null){this.setState({notice:'CHOOSE AN ANSWER \\u2014 GUESSING IS PART OF THE ESTIMATE'});return}\n    const q=ex.fm.items[ex.i],pick=this.state.xPick,ok=pick===q.a;\n    ex.ans.push({q,pick,ok});ex.byDom[q.d]=ex.byDom[q.d]||{n:0,c:0};ex.byDom[q.d].n++;if(ok)ex.byDom[q.d].c++;\n    const e=this.ent(q.c);e.attempts++;if(ok)e.correct++;e.reviewedAt=new Date().toISOString().slice(0,10);\n    e.strength=Math.max(0,e.correct/e.attempts-(e.misconceptions||0)*0.08);this.put(q.c,e);\n    ex.i++;\n    if(ex.i>=ex.fm.items.length){const n=ex.ans.length,c=ex.ans.filter(a=>a.ok).length;const pct=Math.round(c/n*100);\n      this.X['f'+ex.fm.n]={pct,n,at:new Date().toISOString().slice(0,10)};this.save('cvrn-exams',this.X);}\n    this.setState({ex,xPick:null,notice:''});}\n  startRate(){this.setState({gapMode:'rate',notice:''})}\n  rate(d,v){const e=this.ent('dom:'+d.id);e.selfRate=v;this.put('dom:'+d.id,e);\n    d.comps.forEach(c=>{const ce=this.ent(c.id);if(ce.attempts===0){ce.selfRate=v;this.put(c.id,ce)}});this.forceUpdate();}\n  startDiag(){const doms=this.DOMLIST.filter(d=>d.level<=this.S.level);\n    const scored=doms.map(d=>{let r=this.ent('dom:'+d.id).selfRate;if(r==null)r=1;return{d,pri:this.domWt(d)*(3-r+0.5)}}).sort((a,b)=>b.pri-a.pri);\n    const picked=[],seen={};\n    scored.forEach(s=>{const items=this.POOL.filter(q=>q.d===s.d.id&&!seen[q.id]);items.slice(0,picked.length<10?2:1).forEach(q=>{seen[q.id]=1;picked.push(q)})});\n    const items=picked.slice(0,18);\n    if(!item
